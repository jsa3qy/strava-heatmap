<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Activity Heatmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #fafafa;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .map-container {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: #f5f5f5;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #737373;
            font-size: 14px;
            font-weight: 300;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .footer {
            flex-shrink: 0;
            background: #f5f5f5;
            padding: 16px 28px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            border-top: 1px solid #d4d4d4;
            font-size: 13px;
            letter-spacing: 0.02em;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-label {
            font-weight: 400;
            color: #171717;
        }

        .footer-value {
            font-weight: 300;
            color: #737373;
        }

        .footer-separator {
            color: #d4d4d4;
        }

        @media (max-width: 768px) {
            .footer {
                padding: 12px 18px;
                padding-bottom: max(12px, env(safe-area-inset-bottom));
                font-size: 12px;
                flex-direction: column;
                gap: 6px;
            }

            .footer-separator {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div class="loading" id="loading">Loading map...</div>
        <iframe src="heatmap.html" title="Activity Heatmap" id="map-iframe"
                allow="geolocation" loading="eager" onload="hideLoading()"></iframe>
    </div>
    <div class="footer">
        <div class="footer-item">
            <span class="footer-label">Jesse Alloy</span>
        </div>
        <span class="footer-separator">&middot;</span>
        <div class="footer-item">
            <span class="footer-value">149 activities</span>
        </div>
        <span class="footer-separator">&middot;</span>
        <div class="footer-item">
            <span class="footer-label">Latest:</span>
            <span class="footer-value">Afternoon Trail Run</span>
        </div>
        <span class="footer-separator">&middot;</span>
        <div class="footer-item">
            <span class="footer-value">Feb 24, 2026</span>
        </div>
    </div>
    <script>
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        setTimeout(function() {
            var el = document.getElementById('loading');
            if (el && el.style.display !== 'none') {
                el.textContent = 'Map failed to load. Try refreshing.';
            }
        }, 10000);
    </script>
</body>
</html>
